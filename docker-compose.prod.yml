# Docker production overlay, kept as a fallback. The supported production
# path is now non-Docker - see deploy/ and the README - because the server
# runs Apache directly. This still works if you want a containerised host:
# it builds in place rather than pulling from a registry.

services:
  apache:
    build:
      context: apps/web-apache
      dockerfile: Dockerfile
      target: production
      args:
        IMAGE_APACHE_BASE: "${IMAGE_APACHE_BASE}"
    volumes:
      - ./data/uploads:/var/www/uploads
    ports:
      # Loopback only - the host Apache vhost proxies into this, so the
      # container is never reachable from outside the machine.
      - "127.0.0.1:12100:80"

  cv:
    build:
      context: apps/web-cv
      dockerfile: Dockerfile
      target: production
      args:
        IMAGE_CV_BASE: "${IMAGE_CV_BASE}"
    volumes:
      - ./data/db:/srv/data
      - ./data/uploads:/srv/uploads
    depends_on:
      - cv-base

  # Build-only: tags the base image that cv's Dockerfile does FROM. It idles
  # rather than exiting so compose keeps the tag around, the same shape as
  # deco-pvc's *-base services.
  cv-base:
    build:
      context: apps/web-cv
      dockerfile: Dockerfile.base
      target: base
      tags:
        - "${IMAGE_CV_BASE}"
    restart: unless-stopped
    command: tail -f /dev/null
