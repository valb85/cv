# Host Apache vhost for the CV site. Apache cannot run Next.js itself - the app
# is a Node server, and this reverse-proxies to it.
#
#   sudo cp deploy/apache-vhost.conf /etc/apache2/sites-available/cv.conf
#   sudo sed -i 's/cv.example.com/YOUR-DOMAIN/g' /etc/apache2/sites-available/cv.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo apache2ctl -S > /tmp/before.txt        # snapshot the existing vhosts
#   sudo a2ensite cv
#   sudo apache2ctl configtest                  # a failed reload keeps the old config
#   sudo apache2ctl -S | diff /tmp/before.txt - # only this vhost should appear
#   sudo systemctl reload apache2               # reload, never restart
#   sudo certbot --apache -d YOUR-DOMAIN        # -d, so certbot leaves other vhosts alone
#
# ServerName is not optional here: Apache serves the first-loaded vhost to any
# request whose Host matches nothing, and a2ensite loads alphabetically. A
# vhost named cv.conf without a ServerName would answer for everything.

<VirtualHost *:80>
    ServerName cv.example.com

    ErrorLog  ${APACHE_LOG_DIR}/cv-error.log
    CustomLog ${APACHE_LOG_DIR}/cv-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 600
    # Reverse proxy only. Never set ProxyRequests On - mod_proxy is loaded
    # server-wide, and that would turn this into an open forward proxy.
    ProxyRequests Off

    # Uploaded media, served off disk rather than through Node. Lives under the
    # service's StateDirectory so a redeploy cannot remove it.
    Alias /uploads /var/lib/cv/uploads
    <Directory /var/lib/cv/uploads>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
        SetHandler default-handler
    </Directory>

    # Build assets are immutable and content-hashed, so Apache can serve them
    # directly and cache them hard. Must match the deploy target directory.
    Alias /_next/static /srv/cv/.next/static
    <Directory /srv/cv/.next/static>
        Require all granted
        Options -Indexes
        AllowOverride None
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Exclusions come before the catch-all; ProxyPass matches in order.
    ProxyPass /uploads !
    ProxyPass /_next/static !

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # The app decides whether to mark its session cookie Secure from this, so
    # it has to reflect the scheme the browser actually used.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port  expr=%{SERVER_PORT}
</VirtualHost>
