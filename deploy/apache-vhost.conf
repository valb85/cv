# Host Apache vhost for the CV site.
#
#   sudo cp deploy/apache-vhost.conf /etc/apache2/sites-available/cv.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite cv
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then obtain the certificate, which rewrites this file to add the :443 vhost
# and the http->https redirect:
#
#   sudo certbot --apache -d cv.example.com
#
# Replace cv.example.com throughout with the real domain first.

<VirtualHost *:80>
    ServerName cv.example.com

    ErrorLog  ${APACHE_LOG_DIR}/cv-error.log
    CustomLog ${APACHE_LOG_DIR}/cv-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 600

    # The container publishes on loopback only, so nothing reaches it except
    # through this vhost.
    ProxyPass        / http://127.0.0.1:12100/
    ProxyPassReverse / http://127.0.0.1:12100/

    # The container's own apache reads this to decide whether the request was
    # secure; it uses RequestHeader setifempty, so this value wins.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port  expr=%{SERVER_PORT}
</VirtualHost>
