volumes:
  db-data:
    name: "${COMPOSE_PROJECT_NAME}-db-data"
  uploads-data:
    name: "${COMPOSE_PROJECT_NAME}-uploads-data"
  node-modules-data:
    name: "${COMPOSE_PROJECT_NAME}-node-modules-data"
  next-cache-data:
    name: "${COMPOSE_PROJECT_NAME}-next-cache-data"
  caddy-data:
    name: "${COMPOSE_PROJECT_NAME}-caddy-data"
  caddy-config:
    name: "${COMPOSE_PROJECT_NAME}-caddy-config"

services:
  # Terminates TLS for https://cv.localhost and proxies to apache over the
  # compose network. Only :443 is published, so the host caddy service keeps :80.
  caddy:
    image: "${IMAGE_CADDY_BASE}"
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: "Europe/Bucharest"
    depends_on:
      - apache

  apache:
    build:
      context: apps/web-apache
      dockerfile: Dockerfile
      target: production
      args:
        IMAGE_APACHE_BASE: "${IMAGE_APACHE_BASE}"
    volumes:
      - uploads-data:/var/www/uploads
    ports:
      - "12100:80"

  cv:
    build:
      context: apps/web-cv
      dockerfile: Dockerfile
      target: development
      args:
        IMAGE_CV_BASE: "${IMAGE_CV_BASE}"
    volumes:
      - ./apps/web-cv:/srv:delegated
      - node-modules-data:/srv/node_modules
      # Keeps .next out of the bind mount. Docker Desktop remaps container
      # root to host uid 100999, so build output written through the mount
      # lands unwritable by the user who owns the source.
      - next-cache-data:/srv/.next
      - db-data:/srv/data
      - uploads-data:/srv/uploads
    depends_on:
      - cv-base

  cv-base:
    build:
      context: apps/web-cv
      dockerfile: Dockerfile.base
      target: base
      tags:
        - "${IMAGE_CV_BASE}"
    command: tail -f /dev/null

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    logging:
      driver: 'none'
    environment:
      TZ: "Europe/Bucharest"
    ports:
      # 12125, not 8025 or 8125: 8025 is deco-pvc's mailhog and 8125 is the
      # registered StatsD port. Grouped with the 12100 apache port instead.
      - "12125:8025"
