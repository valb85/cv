networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}"

services:
  apache:
    image: "${IMAGE_APACHE}"
    restart: unless-stopped
    environment:
      TZ: "Europe/Bucharest"
    depends_on:
      - cv

  cv:
    image: "${IMAGE_CV}"
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # Optional. Unset means the admin stays at /admin; set it in .env to
      # exercise the secret path locally the way production does.
      ADMIN_PATH: "${ADMIN_PATH:-}"
      BASE_URL: "${BASE_URL}"
      DATABASE_PATH: "${DATABASE_PATH}"
      ENVIRONMENT: "${ENVIRONMENT}"
      SESSION_SECRET: "${SESSION_SECRET}"
      # Proxies in front of Node whose X-Forwarded-For entries are trusted:
      # Caddy + Apache in dev, see src/lib/client-ip.ts.
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      # Contact form human check (Cloudflare Turnstile). Unset = off.
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      UPLOAD_DIR: "${UPLOAD_DIR}"
      TZ: "Europe/Bucharest"
