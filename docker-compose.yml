networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}"

services:
  apache:
    image: "${IMAGE_APACHE}"
    restart: unless-stopped
    environment:
      TZ: "Europe/Bucharest"
    depends_on:
      - cv

  cv:
    image: "${IMAGE_CV}"
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # Optional. Unset means the admin stays at /admin; set it in .env to
      # exercise the secret path locally the way production does.
      ADMIN_PATH: "${ADMIN_PATH:-}"
      BASE_URL: "${BASE_URL}"
      DATABASE_PATH: "${DATABASE_PATH}"
      ENVIRONMENT: "${ENVIRONMENT}"
      SESSION_SECRET: "${SESSION_SECRET}"
      UPLOAD_DIR: "${UPLOAD_DIR}"
      TZ: "Europe/Bucharest"
